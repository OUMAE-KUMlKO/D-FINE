exp_name: visdrone_pred_p2_seed0

DFINEPredRefiner:
  baseline_checkpoint: ./output/visdrone_continue120_20261009/results/visdrone/seed0/g0/best_stg2.pth

train_dataloader:
  total_batch_size: 96
val_dataloader:
  total_batch_size: 96
  dataset:
    ann_file: ./output/visdrone_oracle/instances_val_positive_ids.json
