# Freeze the trained B0 and train independent strip heads at every decoder layer.
model: DFINEAllLayerStripRefiner
criterion: PredRefinementCriterion
output_dir: /cluster/home/zzy/D-FINE/output/uavswarm_strip_beststg2_20260923/all_layer_strip_12ep
exp_name: dfine_l_uavswarm_all_layer_strip_12ep

DFINEAllLayerStripRefiner:
  backbone: HGNetv2
