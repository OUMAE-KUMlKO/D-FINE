__include__: ['./dfine_hgnetv2_l_uavswarm_pred_p2.yml']

# P3: correct final boundary logits with candidate strip evidence, then integrate.
model: DFINEProbabilityRefiner
criterion: ProbabilityRefinementCriterion
output_dir: /cluster/home/zzy/D-FINE/output/uavswarm_strip_beststg2_20260923/p3_probability_calibration
exp_name: dfine_l_uavswarm_pred_p3_probability_calibration

DFINEProbabilityRefiner:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  baseline_checkpoint: null
  feature_level: 0
  hidden_dim: 64
  num_points: 5
  kernel_size: 3
  offset_pixels: 1.0
  query_chunk_size: 32

ProbabilityRefinementCriterion:
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  weight_dict: {loss_bbox: 5, loss_giou: 2, loss_candidate: 0.05}
