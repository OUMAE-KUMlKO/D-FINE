__include__: ['../dfine_hgnetv2_l_coco.yml']

# Native D-FINE: same controlled 80-epoch baseline, only DDF weight changes.
# Use the frozen controlled runtime via run_train_baseline_ddf_off.slurm.
model: DFINE
output_dir: ./output/baseline_ddf_off/uavswarm/seed0
exp_name: dfine_l_uavswarm_baseline_ddf_off_seed0
seed: 0
controlled_seed: 0
epochs: 80
num_classes: 1
remap_mscoco_category: True

HGNetv2:
  pretrained: True
  local_model_dir: weight/hgnetv2/

DFINECriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 0.0}

train_dataloader:
  total_batch_size: 64
  dataset:
    img_folder: /cluster/home/zzy/dataset/UAVSwarm-dataset-master/train
    ann_file: /cluster/home/zzy/dataset/UAVSwarm-dataset-master/annotations/train_half.json
val_dataloader:
  total_batch_size: 64
  dataset:
    img_folder: /cluster/home/zzy/dataset/UAVSwarm-dataset-master/train
    ann_file: /cluster/home/zzy/dataset/UAVSwarm-dataset-master/annotations/val_half.json
