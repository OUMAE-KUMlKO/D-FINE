__include__: ['../../controlled/visdrone_g5_adaptive_band.yml']

# GT marks the nearest valid visual candidate in each of the six G5 layers.
# Warm-start with the ordinary G5 EMA via --tuning; never resume its epoch96.
model: DFINEGTAllLayerStrip
output_dir: ./output/visdrone_g5_gt_candidate/oracle
exp_name: visdrone_g5_gt_candidate_seed0
HGNetv2:
  pretrained: False

DFINEGTAllLayerStrip:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  feature_level: 0
  hidden_dim: 64
  num_points: 5
  normal_points: 7
  kernel_size: 3
  normal_kernel_size: 3
  offset_pixels: 8.0
  bandwidth_mode: box_relative
  bandwidth_ratio: 0.25
  min_offset_pixels: 2.0
  use_log_prior: False
  query_fusion: channel_gate
  query_chunk_size: 32
  checkpoint_strips: True
  num_refine_layers: 6
  adaptive_correction_gate: False
  next_reference_source: corrected
  train_target_format: cxcywh_normalized
  eval_target_format: xyxy_absolute

seed: 0
controlled_seed: 0
epochs: 12
checkpoint_freq: 1
stage2_rollback: False
use_amp: True
use_ema: False
sync_bn: False
find_unused_parameters: False
optimizer:
  type: AdamW
  params:
    - {params: '^(?=.*backbone)(?!.*norm|bn).*$', lr: 0.00000125}
    - {params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$', weight_decay: 0.}
  lr: 0.000025
  betas: [0.9, 0.999]
  weight_decay: 0.000125
lr_scheduler:
  type: MultiStepLR
  milestones: [10]
  gamma: 0.1
lr_warmup_scheduler:
  type: LinearWarmup
  warmup_duration: 50

train_dataloader:
  total_batch_size: 32
  num_workers: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: float32, scale: True}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: True}
  collate_fn:
    base_size: 640
    base_size_repeat: null
    stop_epoch: 1000000
val_dataloader:
  total_batch_size: 32
  num_workers: 4
  dataset:
    ann_file: ./output/visdrone_oracle/instances_val_positive_ids.json
