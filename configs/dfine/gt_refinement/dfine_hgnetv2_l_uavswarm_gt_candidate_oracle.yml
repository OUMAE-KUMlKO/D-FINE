__include__: ['../pred_refinement/dfine_hgnetv2_l_uavswarm_pred_p2.yml']

# Diagnostic oracle: GT selects the nearest valid predicted edge candidate.
# Tangent spans, strip encoding, and box residuals retain the P2 design.
model: DFINEGTCandidateRefiner
criterion: GTRefinementCriterion
output_dir: /cluster/home/zzy/D-FINE/output/uavswarm_strip_beststg2_20260923/p2_gt_nearest
exp_name: dfine_l_uavswarm_gt_candidate_oracle

DFINEGTCandidateRefiner:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
  baseline_checkpoint: null
  feature_level: 0
  hidden_dim: 64
  num_points: 5
  kernel_size: 3
  offset_pixels: 1.0
  max_log_scale: 2.0
  feature_mode: real
  train_target_format: cxcywh_normalized
  eval_target_format: xyxy_absolute

GTRefinementCriterion:
  weight_dict: {loss_bbox: 5, loss_giou: 2}
