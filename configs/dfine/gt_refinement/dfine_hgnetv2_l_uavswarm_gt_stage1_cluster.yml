# G1 and P1 freeze the same newly trained B0; each starts a fresh strip head.
# The Slurm script supplies DFINEGTRefiner.baseline_checkpoint explicitly.
output_dir: /cluster/home/zzy/D-FINE/output/uavswarm_strip_20260923/g1
exp_name: uavswarm_strip_20260923_g1

DFINEGTRefiner:
