__include__: ['./dfine_hgnetv2_l_uavswarm.yml']

# Train the full detector and six independent strip heads from backbone pretraining.
# Keep the original 80-epoch schedule, augmentation, EMA, denoising and criterion.
model: DFINEAllLayerStrip
criterion: DFINECriterion
output_dir: /cluster/home/zzy/D-FINE/output/uavswarm_strip_beststg2_20260923/all_layer_strip_full
exp_name: dfine_l_uavswarm_all_layer_strip_full

HGNetv2:
  pretrained: True
  local_model_dir: weight/hgnetv2/

DFINEAllLayerStrip:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  feature_level: 0
  hidden_dim: 64
  num_points: 5
  kernel_size: 3
  offset_pixels: 1.0
  query_chunk_size: 32
  checkpoint_strips: True

epochs: 80
train_dataloader:
  total_batch_size: 64  # 8 GPU processes x 8 images.
val_dataloader:
  total_batch_size: 64
